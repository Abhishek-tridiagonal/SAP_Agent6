; =========================================================================
; SD & TA Agent -- Configuration
; All non-secret settings live here. Secrets (API keys) are in .env.
; CLI-free: edit this file (or pass an overridden config to run_pipeline).
; =========================================================================

[paths]
raw_data_dir       = ./Raw Data New
processed_data_dir = ./Processed Data New
ia05_template      = ${raw_data_dir}/IA05_Planning Norms Electrical.xlsx
equipment_class_xlsx = ${raw_data_dir}/Equipment Class.xlsx

[plant]
code               = SK
werks              = M014
location_filter    = BOKOR

[run]
; Which year's worklist/tasklist to process this run.
year               = 2024

[llm]
model              = claude-sonnet-4-6
foundry_base_url   = https://tridiagonal-ai-eastus2-resource.services.ai.azure.com/anthropic
temperature        = 0
max_tokens_default = 4096
; Bumped from 900 -> 2000 so the model has room to call submit_cleaning_result
; after reasoning through up to batch_size candidates.
max_tokens_cleaning = 2000

[langfuse]
host                 = http://65.1.79.48:3000
project              = SAP PM Data Revitalization
agent_name           = SD & TA Agent
session_cleaning     = bokor-cleaning
session_job_library  = bokor-job-library
session_merge        = bokor-merge
session_unresolved   = bokor-unresolved

[kg]
host               = pg-db-petronas-sap-prd.postgres.database.azure.com
port               = 5432
database           = sap_pm_kg
user               = abhishek.mali@tridiagonal.ai
token_scope        = https://ossrdbms-aad.database.windows.net/.default

[cleaning_agent]
batch_size         = 100
max_concurrent_llm = 3
; If the candidate pool for one worklist row exceeds this many rows, SKIP the
; LLM path entirely and hand the row to the Unresolved Classifier instead.
; (The LLM path was designed for <=500-row pools; running 100+ batches on
; thousands of candidates is unproductive and burns rate-limit quota.)
max_pool_size_for_llm = 20000

[job_library_agent]
; Equipment class level used for TaskListGroup resolution:
;   2 = broader (fewer, bigger groups)
;   3 = mid
;   4 = finer (more, narrower groups)
class_level        = 4

[unresolved_classifier]
; Walk from fine to coarse; first confident match wins.
; Last fallback is always the Level-1 code from Discipline.
fallback_levels    = 4,3,2

[flags]
; Fetch Equipment Master fresh from the KG (false = reuse cached xlsx if present).
refresh_equipment_master = false
; Fetch Equipment Class fresh from Postgres (false = reuse cached xlsx if present).
refresh_equipment_class  = false

; Stage toggles. Set to false to skip that stage entirely (will reuse its output file).
; NOTE: inline comments on the SAME line as a value are NOT stripped by Python's
;       ConfigParser -- they become part of the value and break _bool() parsing.
;       Keep comments on their own lines (prefixed with ';') like below.

; Stage 1: map messy worklist equipment -> SAP master
run_cleaning             = true
; Stage 2: classify rows the cleaning agent couldn't match to a coarser class
run_unresolved_classifier= true
; Stage 3: cluster equipments into Group Counters (per-year Job Library)
run_job_library          = false
; Stage 4: fold the per-year library into the consolidated one
run_merge                = false
; Stage 5: export consolidated library as SAP IA05 upload workbook
run_sap_export           = false

[rate_limit]
; Retries + backoff for Azure Foundry 429s.
max_retries        = 5
default_wait_sec   = 20
